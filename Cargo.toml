[package]
name = "ai-pick"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
which = "7"
semver = "1"
